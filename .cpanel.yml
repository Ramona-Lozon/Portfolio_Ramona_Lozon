---
deployment:
  tasks:
    - export APP_PATH=/home/thede519/repositories/Portfolio_Ramona_Lozon
    - export PHP=/usr/local/bin/php
    - export COMPOSER=/opt/cpanel/composer/bin/composer

    - $PHP $COMPOSER install --no-dev --optimize-autoloader --no-interaction --working-dir=$APP_PATH
    - $PHP $APP_PATH/artisan migrate --force
    - $PHP $APP_PATH/artisan config:cache
    - $PHP $APP_PATH/artisan route:cache
    - $PHP $APP_PATH/artisan view:cache