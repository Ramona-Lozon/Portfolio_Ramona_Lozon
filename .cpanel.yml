---
deployment:
  tasks:
    - export APP_PATH=/home/thede519/repositories/Portfolio_Ramona_Lozon
    - export PHP=/usr/local/bin/php

    # vendor/ is uploaded by hand, so Composer is skipped for now

    - chmod -R ug+rwX $APP_PATH/storage $APP_PATH/bootstrap/cache
    - $PHP $APP_PATH/artisan migrate --force
    - $PHP $APP_PATH/artisan config:clear
    - $PHP $APP_PATH/artisan config:cache
    - $PHP $APP_PATH/artisan route:cache
    - $PHP $APP_PATH/artisan view:cache

    # Diagnostics: remove once the site works
    - $PHP -v
    - ls -la $APP_PATH/storage/logs $APP_PATH/bootstrap/cache
    - tail -n 40 $APP_PATH/storage/logs/laravel.log || true